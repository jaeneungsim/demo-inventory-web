name: web-preview-destroy

on:
  pull_request:
    types: [closed]

permissions:
  contents: read

concurrency:
  group: web-preview-${{ github.head_ref }}
  cancel-in-progress: false

jobs:
  destroy:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    env:
      AWS_REGION: ${{ vars.AWS_REGION || 'ap-southeast-2' }}
      WEB_PREVIEW_BUCKET: ${{ vars.WEB_PREVIEW_BUCKET }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          package-manager-cache: false

      - name: Find the ticket stage
        id: stage
        env:
          HEAD_REF: ${{ github.head_ref }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          stage=$(node scripts/ticket-stage.mjs --optional)
          echo "stage=$stage" >> "$GITHUB_OUTPUT"

      - if: steps.stage.outputs.stage != ''
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.PREVIEW_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Remove the preview files
        if: steps.stage.outputs.stage != ''
        env:
          STAGE: ${{ steps.stage.outputs.stage }}
        run: aws s3 rm "s3://$WEB_PREVIEW_BUCKET/$STAGE/" --recursive
